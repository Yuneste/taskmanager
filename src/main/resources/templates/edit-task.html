<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Task</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Edit Task</h1>

        <form th:action="@{/tasks/{id}/edit(id=${task.id})}" th:object="${task}" method="post">
            <div class="form-group">
                <label for="title">Title</label>
                <input id="title" type="text" th:field="*{title}">
                <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <input id="description" type="text" th:field="*{description}">
            </div>

            <div class="form-group">
                <label for="priority">Priority</label>
                <select id="priority" th:field="*{priority}">
                    <option th:each="priority : ${priorities}"
                            th:value="${priority}"
                            th:text="${priority}">
                    </option>
                </select>
                <p class="error" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></p>
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" th:field="*{status}">
                    <option th:each="status : ${statuses}"
                            th:value="${status}"
                            th:text="${status}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="dueDate">Due date</label>
                <input id="dueDate" type="date" th:field="*{dueDate}">
                <p class="error" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></p>
            </div>

            <button type="submit">Save Changes</button>
            <a class="button-link" th:href="@{/}">Back to tasks</a>
        </form>
    </div>
</div>
</body>
</html>
